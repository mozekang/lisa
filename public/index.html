<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lisa の小さなお部屋</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell">
<main><section class="game" aria-label="Lisa のお部屋ゲーム"><div class="dashboard"><div class="profile"><div class="avatar"><img src="/assets/lisa-run.png" alt=""></div><div><div class="profile-name">妹のおうち <span>♡</span></div><span class="status" id="status">おへやでのんびり</span></div></div><div class="meters"><div class="meter"><span>♡ げんき</span><div><i id="energy" style="width:82%"></i></div><small id="energy-value">82 / 100</small></div><div class="meter happiness"><span>✿ ごきげん</span><div><i id="mood" style="width:90%"></i></div><small id="mood-value">90 / 100</small></div><div class="meter hunger"><span>♧ おなか</span><div><i id="food" style="width:68%"></i></div><small id="food-value">68 / 100</small></div></div><div class="clock"><span id="date"></span><strong id="time"></strong><small>☀ ぽかぽか</small></div><div class="toolbar"><button id="version" class="version-tag" aria-haspopup="dialog">V6</button><button class="icon-button" id="sound" aria-label="サウンドをオンにする" title="サウンド">♫<span class="sound-dot"></span></button><button class="icon-button" id="settings" aria-label="設定" title="設定">⚙</button><button class="icon-button" id="help" aria-label="遊び方">?</button></div></div>
<div class="room" id="room"><img class="room-image" src="/assets/objects/foundation.png" alt="床と壁" draggable="false"><div id="objects"></div><div class="room-shade"></div><div class="room-caption"><span class="live-dot"></span> Lisa のおへや</div><div id="zones"></div><div id="destination" hidden>✿</div><div id="character" class="character"><div class="character-shadow"></div><div class="sprite"></div><span class="name-tag">Lisa</span></div><div class="action-menu" id="menu" hidden></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="room-hint">✧ 気になる場所をクリックしてね</div></div>
</section></main></div>
<dialog id="help-dialog"><button class="close" id="close-help" aria-label="閉じる">×</button><span class="dialog-flower">✿</span><h2>おへやの過ごし方</h2><p>ベッド・キッチン・デスク・クローゼット・わんこをクリック。<br>Lisa が走って到着すると、行動メニューが開きます。</p><p>床をクリックすると、好きな場所へ移動できます。<br>行動を選んで、Lisa の毎日を楽しもう。</p><button id="start-playing">あそぼう ♡</button></dialog><dialog id="settings-dialog"><button class="close" id="close-settings" aria-label="閉じる">×</button><span class="dialog-flower">⚙</span><h2>設定</h2><label class="language-label">表示言語</label><div class="language-options"><button id="language-ja" lang="ja" aria-pressed="true">日本語</button><button id="language-zh" lang="zh-CN" aria-pressed="false">简体中文</button></div><section class="music-settings" aria-labelledby="music-heading"><h3 id="music-heading">背景音楽</h3><label class="music-toggle"><input id="bgm-enabled" type="checkbox">音楽を再生する</label><div class="volume-label"><label for="bgm-volume">音楽の音量</label><output id="bgm-volume-value" for="bgm-volume">35%</output></div><input id="bgm-volume" type="range" min="0" max="100" step="1" value="35"><p id="bgm-status" role="status" aria-live="polite">停止中</p></section><p class="settings-note">設定は自動で保存されます。</p></dialog><dialog id="version-dialog" aria-labelledby="version-heading"><button class="close" id="close-version" aria-label="閉じる">×</button><h2 id="version-heading">更新履歴</h2><div id="release-notes"></div></dialog><script src="/releases.js"></script><script src="/app.js"></script><audio id="bgm" loop preload="metadata"></audio><script src="/music.js"></script><script src="/i18n.js"></script></body></html>
